name: Update Market Prices (Every 2 Hours)

on:
  schedule:
    # ── Refresh every 2 hours (12 times a day) ──
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI anytime

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Pull latest remote main
        run: |
          git config user.name "BASML Price Bot"
          git config user.email "procurement@basml.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Fetch live ICE Cotton & Exchange Rate prices
        run: node scripts/update-prices.cjs

      - name: Commit updated prices
        run: |
          git add public/market-prices.json
          if git diff --staged --quiet; then
            echo "No price changes to commit"
          else
            git commit -m "chore: auto-update market prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
            echo "✅ Prices committed and pushed"
          fi


      - name: Install dependencies
        run: npm ci

      - name: Build with updated prices
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
