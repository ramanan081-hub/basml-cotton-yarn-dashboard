name: Update Market Prices (3x Daily)

on:
  schedule:
    # ── 3 refreshes per day aligned with global cotton market sessions ──────
    # Session 1: 6:30 AM IST  = 01:00 UTC  → Pre-market / MCX open
    - cron: '0 1 * * *'
    # Session 2: 12:30 PM IST = 07:00 UTC  → London/European session mid-day
    - cron: '0 7 * * *'
    # Session 3: 4:30 PM IST  = 11:00 UTC  → ICE New York cotton open
    - cron: '0 11 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI anytime

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch live ICE Cotton & Exchange Rate prices
        id: fetch_prices
        run: |
          # ── Exchange Rate: USD → INR ─────────────────────────────────────────
          USD_INR=84.35
          EUR_INR=90.70
          
          RATE_JSON=$(curl -sf --max-time 10 "https://open.er-api.com/v6/latest/USD" || echo "")
          if [ -n "$RATE_JSON" ]; then
            NEW_USD_INR=$(echo "$RATE_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['rates']['INR'],2))" 2>/dev/null || echo "")
            NEW_EUR_INR=$(echo "$RATE_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['rates']['INR']/d['rates']['EUR'],2))" 2>/dev/null || echo "")
            if [ -n "$NEW_USD_INR" ]; then USD_INR=$NEW_USD_INR; fi
            if [ -n "$NEW_EUR_INR" ]; then EUR_INR=$NEW_EUR_INR; fi
            echo "✅ Exchange rates: USD/INR=$USD_INR, EUR/INR=$EUR_INR"
          else
            echo "⚠️ Exchange rate fetch failed, using fallback"
          fi

          # ── ICE Cotton Futures (CT=F) via Yahoo Finance ──────────────────────
          ICE_PRICE=77.42
          SOURCE="baseline"
          
          # Try Yahoo Finance (server-side, no CORS restrictions!)
          YF_JSON=$(curl -sf --max-time 15 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: application/json" \
            "https://query1.finance.yahoo.com/v8/finance/chart/CT=F?interval=1d&range=5d" || echo "")
          
          if [ -n "$YF_JSON" ]; then
            NEW_PRICE=$(echo "$YF_JSON" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          result = d.get('chart',{}).get('result',[{}])
          if result:
              p = result[0].get('meta',{}).get('regularMarketPrice')
              if p and 50 < p < 200:
                  print(round(float(p),2))
          " 2>/dev/null || echo "")
            if [ -n "$NEW_PRICE" ]; then
              ICE_PRICE=$NEW_PRICE
              SOURCE="yahoo-finance-live"
              echo "✅ ICE Cotton (Yahoo): $ICE_PRICE ¢/lb"
            fi
          fi

          # Try Stooq as backup
          if [ "$SOURCE" = "baseline" ]; then
            STOOQ_JSON=$(curl -sf --max-time 10 \
              "https://stooq.com/q/l/?s=ct.f&f=sd2t2ohlcvp&h&e=json" || echo "")
            if [ -n "$STOOQ_JSON" ]; then
              NEW_PRICE=$(echo "$STOOQ_JSON" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          syms = d.get('symbols',[])
          if syms:
              p = syms[0].get('close')
              if p and 50 < float(p) < 200:
                  print(round(float(p),2))
          " 2>/dev/null || echo "")
              if [ -n "$NEW_PRICE" ]; then
                ICE_PRICE=$NEW_PRICE
                SOURCE="stooq-live"
                echo "✅ ICE Cotton (Stooq): $ICE_PRICE ¢/lb"
              fi
            fi
          fi

          echo "📊 Final: ICE=$ICE_PRICE, USD/INR=$USD_INR, EUR/INR=$EUR_INR, source=$SOURCE"
          
          # ── Write market-prices.json ─────────────────────────────────────────
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 -c "
          import json
          data = {
              'iceCottonCentsPerLb': float('$ICE_PRICE'),
              'usdInr': float('$USD_INR'),
              'eurInr': float('$EUR_INR'),
              'lastUpdated': '$TIMESTAMP',
              'source': '$SOURCE',
              'note': 'Auto-updated 3x daily (6:30 AM, 12:30 PM, 4:30 PM IST) by GitHub Actions.'
          }
          with open('public/market-prices.json','w') as f:
              json.dump(data, f, indent=2)
          print('Written market-prices.json')
          "

      - name: Commit updated prices
        run: |
          git config user.name "BASML Price Bot"
          git config user.email "procurement@basml.com"
          git add public/market-prices.json
          if git diff --staged --quiet; then
            echo "No price changes to commit"
          else
            git commit -m "chore: auto-update market prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Prices committed and pushed"
          fi

      - name: Set up Node (for rebuild)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with updated prices
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
